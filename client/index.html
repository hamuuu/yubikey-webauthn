<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Register</title>
    <script src="https://webauthn.io/static/js/simplewebauthn-browser.8.2.1.umd.min.js"></script>
    <style>
        /* Existing styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            color: #555;
        }
        input[type="text"], input[type="password"], input[type="text"].otp {
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            padding: 10px;
            background-color: #28a745;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #218838;
        }
        .toggle-action {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .toggle-action label {
            margin: 0 10px;
            color: #333;
            cursor: pointer;
        }
        .logged-in-message {
            text-align: center;
        }
        .logged-in-message p {
            margin-bottom: 20px;
            color: #333;
        }
        .logged-in-message button {
            background-color: #007bff;
        }
        .logged-in-message button:last-of-type {
            background-color: #dc3545;
        }
    </style>
    <script>
        const {
            browserSupportsWebAuthn,
            startRegistration,
            startAuthentication,
            browserSupportsWebAuthnAutofill,
        } = SimpleWebAuthnBrowser;

        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('jwtToken');
            const formContainer = document.getElementById('form-container');
            const loggedInMessage = document.getElementById('logged-in-message');

            if (token) {
                formContainer.style.display = 'none';
                loggedInMessage.style.display = 'block';
            } else {
                formContainer.style.display = 'block';
                loggedInMessage.style.display = 'none';
            }
        });

        async function handleSubmit(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const yubikeyOtp = document.getElementById('otp').value;
            const action = document.querySelector('input[name="action"]:checked').value;

            try {
                let response;
                if (action === 'register') {
                    response = await fetch('http://localhost:8080/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username })
                    });

                    if (!response.ok) {
                        throw new Error('Failed to initiate WebAuthn registration');
                    }

                    const { publicKey } = await response.json();
                    const credential = await startRegistration(publicKey);

                    response = await fetch('http://localhost:8080/register/finish', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, ...credential })
                    });

                    if (!response.ok) {
                        throw new Error('Failed to finish WebAuthn registration');
                    }

                    alert('Registration successful');

                } else if (action === 'login') {
                    response = await fetch('http://localhost:8080/login/begin', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, password })
                    });

                    if (!response.ok) {
                        throw new Error('Failed to initiate WebAuthn login');
                    }

                    const { publicKey } = await response.json();
                    const authResp = await startAuthentication(publicKey, false);

                    response = await fetch('http://localhost:8080/login/finish', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, ...authResp })
                    });

                    if (!response.ok) {
                        throw new Error('Failed to finish WebAuthn login');
                    }

                    const { token } = await response.json();
                    localStorage.setItem('jwtToken', token);
                    localStorage.setItem('username', username);

                    document.getElementById('form-container').style.display = 'none';
                    document.getElementById('logged-in-message').style.display = 'block';

                    alert('Login successful');

                } else if (action === 'otp-login') {
                    response = await fetch('http://localhost:8080/login/otp', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, otp: yubikeyOtp })
                    });

                    if (!response.ok) {
                        throw new Error('Failed to authenticate with YubiKey OTP');
                    }

                    const { token } = await response.json();
                    localStorage.setItem('jwtToken', token);
                    localStorage.setItem('username', username);

                    document.getElementById('form-container').style.display = 'none';
                    document.getElementById('logged-in-message').style.display = 'block';

                    alert('Login successful with YubiKey OTP');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Operation failed');
            }
        }

        async function hitProtectedEndpoint() {
            const token = localStorage.getItem('jwtToken');

            try {
                const response = await fetch('http://localhost:8080/protected', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to access protected endpoint');
                }

                const data = await response.text();
                alert(data);
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to access protected endpoint');
            }
        }

        async function hitProtectedWithWebAuthnEndpoint() {
            const token = localStorage.getItem('jwtToken');
            const username = localStorage.getItem('username');

            let response;
            try {
                response = await fetch('http://localhost:8080/login/begin', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username })
                });

                if (!response.ok) {
                    throw new Error('Failed to initiate WebAuthn login');
                }

                const { publicKey } = await response.json();
                const authResp = await startAuthentication(publicKey, false);

                response = await fetch('http://localhost:8080/login/finish', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, ...authResp })
                });

                if (!response.ok) {
                    throw new Error('Failed to finish WebAuthn login');
                }

                response = await fetch('http://localhost:8080/protected/webauthn', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to access protected WebAuthn endpoint');
                }

                const data = await response.text();
                alert(data);
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to access protected WebAuthn endpoint');
            }
        }

        async function hitProtectedOtpEndpoint() {
            const token = localStorage.getItem('jwtToken');
            const otp = prompt('Enter your YubiKey OTP:');

            if (!otp) {
                alert('OTP is required');
                return;
            }

            try {
                const response = await fetch('http://localhost:8080/protected/otp', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ otp })
                });

                if (!response.ok) {
                    throw new Error('Failed to access protected OTP endpoint');
                }

                const data = await response.text();
                alert(data);
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to access protected OTP endpoint');
            }
        }

        function logout() {
            localStorage.removeItem('jwtToken');
            document.getElementById('form-container').style.display = 'block';
            document.getElementById('logged-in-message').style.display = 'none';
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Login/Register</h1>
        <div id="form-container">
            <div class="toggle-action">
                <label>
                    <input type="radio" name="action" value="register" checked> Register
                </label>
                <label>
                    <input type="radio" name="action" value="login"> Login
                </label>
                <label>
                    <input type="radio" name="action" value="otp-login"> YubiKey OTP Login
                </label>
            </div>
            <form onsubmit="handleSubmit(event);">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password">
                <label for="otp" class="otp-label" style="display: none;">YubiKey OTP:</label>
                <input type="text" id="otp" name="otp" class="otp" style="display: none;">
                <button type="submit">Submit</button>
            </form>
        </div>
        <div id="logged-in-message" class="logged-in-message" style="display: none;">
            <p>You are logged in!</p>
            <button id="protected-button" onclick="hitProtectedEndpoint()">Access Protected Endpoint</button>
            <button id="protected-with-webauthn-button" onclick="hitProtectedWithWebAuthnEndpoint()">Access Protected WebAuthn Endpoint</button>
            <button id="protected-otp-button" onclick="hitProtectedOtpEndpoint()">Access Protected OTP Endpoint</button>
            <button id="logout-button" onclick="logout()">Logout</button>
        </div>
    </div>
    <script>
        // Toggle OTP field visibility based on selected action
        document.querySelectorAll('input[name="action"]').forEach(radio => {
            radio.addEventListener('change', () => {
                const otpLabel = document.querySelector('.otp-label');
                const otpInput = document.querySelector('.otp');
                if (document.querySelector('input[name="action"]:checked').value === 'otp-login') {
                    otpLabel.style.display = 'block';
                    otpInput.style.display = 'block';
                } else {
                    otpLabel.style.display = 'none';
                    otpInput.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
