<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Register</title>
    <script>
        async function handleSubmit(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const action = document.querySelector('input[name="action"]:checked').value;

            try {
                let response;
                if (action === 'register') {
                    response = await fetch('http://localhost:8080/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username })
                    });

                    if (!response.ok) {
                        throw new Error('Failed to initiate WebAuthn registration');
                    }

                    const { publicKey } = await response.json();

                    // Prepare WebAuthn options for the create() method
                    const publicKeyOptions = {
                        challenge: Uint8Array.from(publicKey.challenge, c => c.charCodeAt(0)),
                        rp: {
                            name: publicKey.rp.name,
                            id: publicKey.rp.id
                        },
                        user: {
                            id: Uint8Array.from(publicKey.user.id, c => c.charCodeAt(0)),
                            name: publicKey.user.name,
                            displayName: publicKey.user.displayName
                        },
                        pubKeyCredParams: publicKey.pubKeyCredParams.map(param => ({
                            type: param.type,
                            alg: param.alg
                        })),
                        timeout: publicKey.timeout,
                        authenticatorSelection: publicKey.authenticatorSelection || {},
                        attestation: publicKey.attestation || "direct",
                        excludeCredentials: publicKey.excludeCredentials ? publicKey.excludeCredentials.map(cred => ({
                            id: base64ToUint8Array(cred.id),
                            type: cred.type
                        })) : []
                    };

                    // Start WebAuthn registration
                    const credential = await navigator.credentials.create({ publicKey: publicKeyOptions });

                    // Prepare the registration response to send to the server
                    const registrationResponse = {
                        id: credential.id,
                        rawId: btoa(String.fromCharCode(...new Uint8Array(credential.rawId))),
                        type: credential.type,
                        response: {
                            attestationObject: btoa(String.fromCharCode(...new Uint8Array(credential.response.attestationObject))),
                            clientDataJSON: btoa(String.fromCharCode(...new Uint8Array(credential.response.clientDataJSON)))
                        }
                    };

                    response = await fetch('http://localhost:8080/register/finish', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, registrationData: registrationResponse, password })
                    });

                    if (!response.ok) {
                        throw new Error('Failed to finish WebAuthn registration');
                    }

                    alert('Registration successful');

                } else if (action === 'login') {
                    response = await fetch('http://localhost:8080/begin-login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, password })
                    });

                    if (!response.ok) {
                        throw new Error('Failed to initiate WebAuthn login');
                    }

                    const { options } = await response.json();

                    // Start WebAuthn authentication
                    const publicKey = {
                        challenge: Uint8Array.from(atob(options.challenge), c => c.charCodeAt(0)),
                        rpId: options.rpId,
                        allowCredentials: options.allowCredentials.map(cred => ({
                            id: Uint8Array.from(atob(cred.id), c => c.charCodeAt(0)),
                            type: cred.type
                        })),
                        timeout: options.timeout,
                        userVerification: options.userVerification
                    };

                    const assertion = await navigator.credentials.get({ publicKey });

                    // Send the authentication response to the server
                    const authResponse = {
                        id: assertion.id,
                        rawId: btoa(String.fromCharCode(...new Uint8Array(assertion.rawId))),
                        type: assertion.type,
                        response: {
                            authenticatorData: btoa(String.fromCharCode(...new Uint8Array(assertion.response.authenticatorData))),
                            clientDataJSON: btoa(String.fromCharCode(...new Uint8Array(assertion.response.clientDataJSON))),
                            signature: btoa(String.fromCharCode(...new Uint8Array(assertion.response.signature))),
                            userHandle: assertion.response.userHandle ? btoa(String.fromCharCode(...new Uint8Array(assertion.response.userHandle))) : null
                        }
                    };

                    response = await fetch('http://localhost:8080/finish-login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ username, authenticationData: authResponse })
                    });

                    if (!response.ok) {
                        throw new Error('Failed to finish WebAuthn login');
                    }

                    const { token } = await response.json();
                    localStorage.setItem('token', token);
                    alert('Login successful');

                    // Hide the form and show the logged in message
                    document.getElementById('auth-container').style.display = 'none';
                    document.getElementById('loggedin-container').style.display = 'block';
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Operation failed');
            }
        }

        async function handleProtectedEndpoint() {
            const token = localStorage.getItem('token');
            if (!token) {
                alert('No token found. Please log in.');
                return;
            }

            try {
                const response = await fetch('http://localhost:8080/protected', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to access protected endpoint');
                }

                const data = await response.text();
                alert(data);
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to access protected endpoint');
            }
        }

        async function handleProtectedEndpointWithWebAuthn() {
            const token = localStorage.getItem('token');
            if (!token) {
                alert('No token found. Please log in.');
                return;
            }

            try {
                // Request options for WebAuthn authentication
                const response = await fetch('http://localhost:8080/begin-webauthn-auth', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to get WebAuthn options');
                }

                const { options } = await response.json();

                // Start WebAuthn authentication
                const publicKey = {
                    challenge: Uint8Array.from(atob(options.challenge), c => c.charCodeAt(0)),
                    rpId: options.rpId,
                    allowCredentials: options.allowCredentials.map(cred => ({
                        id: Uint8Array.from(atob(cred.id), c => c.charCodeAt(0)),
                        type: cred.type
                    })),
                    timeout: options.timeout,
                    userVerification: options.userVerification
                };

                const assertion = await navigator.credentials.get({ publicKey });

                // Send the authentication response to the server
                const authResponse = {
                    id: assertion.id,
                    rawId: btoa(String.fromCharCode(...new Uint8Array(assertion.rawId))),
                    type: assertion.type,
                    response: {
                        authenticatorData: btoa(String.fromCharCode(...new Uint8Array(assertion.response.authenticatorData))),
                        clientDataJSON: btoa(String.fromCharCode(...new Uint8Array(assertion.response.clientDataJSON))),
                        signature: btoa(String.fromCharCode(...new Uint8Array(assertion.response.signature))),
                        userHandle: assertion.response.userHandle ? btoa(String.fromCharCode(...new Uint8Array(assertion.response.userHandle))) : null
                    }
                };

                // Call protected endpoint with WebAuthn
                const protectedResponse = await fetch('http://localhost:8080/protected-webauthn', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ authenticationData: authResponse })
                });

                if (!protectedResponse.ok) {
                    throw new Error('Failed to access protected endpoint with WebAuthn');
                }

                const data = await protectedResponse.text();
                alert(data);
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to access protected endpoint with WebAuthn');
            }
        }

        function handleLogout() {
            localStorage.removeItem('token');
            document.getElementById('auth-container').style.display = 'block';
            document.getElementById('loggedin-container').style.display = 'none';
        }
    </script>
</head>
<body>
    <div id="auth-container">
        <h1>Login/Register</h1>
        <form onsubmit="handleSubmit(event);">
            <label>
                <input type="radio" name="action" value="register" checked> Register
            </label>
            <label>
                <input type="radio" name="action" value="login"> Login
            </label>
            <br>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <br>
            <button type="submit">Submit</button>
        </form>
    </div>

    <div id="loggedin-container" style="display: none;">
        <h1>You are logged in!</h1>
        <button onclick="handleProtectedEndpoint()">Access Protected Endpoint</button>
        <button onclick="handleProtectedEndpointWithWebAuthn()">Access Protected Endpoint with WebAuthn</button>
        <br>
        <button onclick="handleLogout()">Logout</button>
    </div>
</body>
</html>
